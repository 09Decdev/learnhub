name: Deploy on github pages
on:
  push:
    branches:[
      main
    ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: for n in 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17; do node scripts/check-theory.mjs $n; done
      - run: npm run build
        env:
          BASE_URL: /learnhub/
          VITE_GOOGLE_CLIENT_ID: ${{ var.VITE_GOOGLE_CLIENT_ID }}
    
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
     - id: deployment
       uses: actions/deploy-pages@v5